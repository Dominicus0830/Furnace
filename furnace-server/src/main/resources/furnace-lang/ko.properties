stop.flush-deadline=[Stop] {0}: 저장 마감을 넘겨 청크 {1}개를 저장하지 못했습니다(-1 = 수 모름)
stop.flush-interrupted=[Stop] region 저장을 기다리다 중단됐습니다
stop.player-data-timeout=[Stop] 플레이어 데이터 저장이 30초 안에 끝나지 않았습니다
stop.player-data-interrupted=[Stop] 플레이어 데이터 저장을 기다리다 중단됐습니다
stop.save-failures=[Stop] 재시도 끝에도 실패한 저장이 {}건입니다 - 해당 청크·엔티티는 디스크에 최신이 아닐 수 있습니다
stop.flush-failed=[Stop] 저장(flush)에 실패했습니다
stop.step-exit=[Stop] 종료 단계 {} 안에서 System.exit 가 불렸습니다 - 남은 단계를 이 스레드에서 이어 갑니다
stop.step-failed=[Stop] 종료 단계 {} 가 실패했습니다

