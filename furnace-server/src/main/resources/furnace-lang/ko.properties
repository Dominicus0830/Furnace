cfg.help.chunk-eviction-grace-ticks=아무도 보지 않는 청크를 메모리에서 내리기 전 기다리는 틱.
cfg.help.entity-view-distance=엔티티가 보이는 거리(청크). view-distance 보다 크면 view-distance 까지만.
cfg.help.worlds.autoload=서버 시작 때 함께 여는 추가 월드 이름(쉼표로 구분).
cfg.help.dimension-seed.the_nether=네더 생성 시드. 주석이면 주 월드 시드(바닐라). 숫자 또는 글자.
cfg.help.dimension-seed.the_end=엔드 생성 시드. 위와 같다.
cfg.help.worldgen-hooks.overworld=오버월드에 걸 플러그인 월드젠 훅 키(namespace:path). 주석이면 바닐라.
cfg.help.worldgen-hooks.the_nether=네더에 걸 플러그인 월드젠 훅 키. 위와 같다.
cfg.help.worldgen-hooks.the_end=엔드에 걸 플러그인 월드젠 훅 키. 위와 같다.
cfg.help.world-generator.overworld=오버월드를 만들 생성기 플러그인 "플러그인[:id]"(Bukkit bukkit.yml worlds.<이름>.generator). Bukkit 플러그인은 load: STARTUP 이어야 한다. 주석이면 바닐라. 다른 이름의 월드는 world-generator.name.<월드 이름>=플러그인[:id](플러그인이 그 이름의 월드를 생성기 없이 만들 때 쓴다. 바이옴 공급자는 world-biome-provider.name.<월드 이름>).
cfg.help.world-generator.the_nether=네더(월드 이름 <level-name>_nether)를 만들 생성기 플러그인. 위와 같다.
cfg.help.world-generator.the_end=엔드(월드 이름 <level-name>_the_end)를 만들 생성기 플러그인. 위와 같다.
cfg.help.world-biome-provider.overworld=오버월드 바이옴을 정할 공급자 플러그인 "플러그인[:id]"(bukkit.yml worlds.<이름>.biome-provider). 주석이면 생성기의 바이옴.
cfg.help.world-biome-provider.the_nether=네더 바이옴을 정할 공급자 플러그인. 위와 같다.
cfg.help.world-biome-provider.the_end=엔드 바이옴을 정할 공급자 플러그인. 위와 같다.
cfg.help.worldgen.tick-guard=생성 조절기. true 면 가장 느린 region 의 1초 TPS 가 19 아래일 때 동시 청크 생성 수를 하나씩 줄이고(1 까지) 19.8 이상이면 다시 늘린다. 새 땅을 많이 만들 때 TPS 바닥을 지키는 대신 생성이 느려진다(실측 1판: TPS 최저 4~6 → 9.8, 생성 −35%). 생성과 무관한 렉(다른 차원의 큰 농장 등)이어도 모든 생성을 1개까지 묶는다. 기본 false(조절 안 함).
cfg.help.enchantments.disabled=끌 마법부여 id(쉼표로 구분, 예: minecraft:mending). 비우면 모두 켜짐(바닐라).
cfg.help.tick-nanos=한 틱의 길이(나노초). 50000000 = 초당 20틱(바닐라).
cfg.help.region-threads=region 을 돌리는 스레드 수(공유 풀이면 서버 전체, 끄면 차원마다). 주석이면 CPU 코어 수.
cfg.help.shared-region-pool=true 면 모든 차원·추가 월드가 region 워커 풀 하나를 함께 쓴다. false 면 차원마다 region-threads 개.
cfg.help.region-pool-dim-cap=공유 풀에서 다른 차원에 일이 있을 때 한 차원이 쓸 수 있는 워커 상한(0 = 워커 수−1).
cfg.help.region-pool-starve-ticks=차원의 가장 이른 일이 이 틱 수만큼 밀리면 그 차원을 먼저 돌린다. 1 이상.
cfg.help.region-section-shift=구역 크기 = 2^값 청크(3 → 8×8 청크). 다른 region 사이는 적어도 2^값×16+1 블록(3 이면 129) 떨어진다. 1~8.
cfg.help.region-merge-radius=이 반경(구역 단위) 안의 구역은 같은 region 으로 합친다. 1 이상.
cfg.help.light.async=true 면 빛 계산을 region 스레드 대신 빛 스레드가 한다(바닐라 방식). 램프 시계 같은 큰 빛 장치가 TPS 를 먹지 않는 대신, 빛 스레드가 밀리면 바닐라 과부하 때처럼 빛이 한두 틱 늦게 보이고 새 청크 전송이 한 틱 늦다. 기본 false(지금 동작).
cfg.help.light.async-threads=light.async 의 빛 스레드 수(서버 전체). 1 이상.
cfg.help.entity-activation-range.enabled=엔티티 활성 범위(Spigot·Paper 와 같은 방식). true(기본)면 플레이어에게서 먼 몹은 AI·길찾기·이동을 대부분 쉬어 서버가 가벼워지지만 바닐라와 결과가 달라진다(먼 곳 농장·몹 이동이 느려짐). false 면 바닐라와 똑같다. 아래 값은 Paper 기본값이다(범위 단위: 블록, 0 이하 = 그 종류는 늘 활성).
cfg.help.merge-radius.item=떨어진 아이템을 합치는 반경(블록, Spigot 식). 0.5(기본) = 바닐라. 키우면 멀리 떨어진 아이템도 합쳐진다.
cfg.help.merge-radius.exp=경험치 구슬을 합치는 반경(블록). 0 이하(기본) = 바닐라. 켜면 새 구슬이 반경 안의 같은 묶음 수 구슬 값을 흡수한다(Spigot·Paper).
cfg.help.collisions.max-entity-collisions=생물 하나가 한 틱에 미는 엔티티 수 상한(Paper 기본 8). 좁은 우리에 몹을 몰아넣은 농장이 가벼워지지만 바닐라와 결과가 다르다. -1 = 제한 없음(바닐라), 0 = 밀지 않음. maxEntityCramming 피해는 이 값과 상관없이 바닐라대로.
cfg.help.entity-tracking-range.enabled=종류별 추적 거리(이 거리 안 플레이어에게만 엔티티를 보낸다). true(기본) = 아래 Paper 기본값, false = 바닐라(종류마다 다름). 실제 거리는 min(이 값 × entity-broadcast-range-percentage/100, 시야 × 16).
cfg.help.item-merge.always-into-ticking=아이템을 합칠 때 늘 지금 틱을 도는 아이템 쪽으로 모은다(Spigot·Paper). false = 바닐라(개수가 적은 쪽을 많은 쪽에) — 어느 아이템이 남는지가 달라진다.
cfg.help.collisions.skip-unpushable=밀 수 없는 생물(사다리·덩굴에 매달린 몹, 관전자 등)은 남을 밀지 않고 maxEntityCramming 피해도 받지 않는다(Paper). false = 바닐라.
cfg.help.collisions.allow-player-cramming-damage=플레이어가 maxEntityCramming 피해를 받는가. false(기본, Paper) = 한곳에 플레이어를 많이 모아도 죽지 않는다. true = 바닐라.
cfg.help.chat.strict-order=true(바닐라)면 순서가 어긋난 채팅에서 서명 체인을 끊는다. false 면 그 메시지만 버린다.
cfg.help.chat.unsigned-as-system=true 면 채팅을 서명 없는 시스템 메시지로 보낸다(채팅 신고 불가).
cfg.help.server-brand=F3 화면에 보이는 서버 브랜드.
cfg.help.commands.send-namespaced=true(기본, Paper 와 같다)면 minecraft:give 같은 바닐라 명령 별칭이 자동완성에 보인다. false 면 안 보이지만 쳐서 실행은 된다.
cfg.help.commands.region-drain=true(기본)면 함수·명령이 region 의 칸·엔티티를 만질 때 다음 틱을 기다리지 않고 곧바로 처리한다(#tick 함수가 초당 20번 그대로 돈다). 전역 틱당 20ms 예산을 명령 블록과 나눠 쓰고 넘으면 다음 틱. false 면 접근 한 줄이 한 틱씩 걸린다.
cfg.help.announce-sleep-status=false 면 자는 사람 수 액션바를 보내지 않는다(기본 true = 바닐라).
cfg.help.world.tick-when-empty=플레이어도 /forceload 도 없는 차원의 몹·호퍼: vanilla 면 15초 뒤 쉰다(바닐라), always 면 늘 돈다(Paper·Spigot 기본), auto(기본)면 Bukkit 플러그인이 있을 때만 always.
cfg.help.gravity-block-portal-dupe=true 면(기본 = 바닐라) 엔드 포털로 넘어간 모래·자갈 같은 중력 블록이 제자리에도 놓여 복제된다. false 면 복제되지 않는다.
cfg.help.motd-format=server.properties 의 motd 해석: plain(기본, 바닐라) | legacy(& 색 코드) | markup(<gradient:red:blue>…</gradient> 같은 태그).
cfg.help.confirm-interrupt=true 면 콘솔 Ctrl+C 를 한 번 더 눌러야 종료한다.
cfg.help.confirm-interrupt-seconds=Ctrl+C 두 번째 입력을 기다리는 시간(1~60초).
cfg.help.velocity-secret=Velocity 모던 포워딩 비밀 키. 비우면 끔.
cfg.help.bungeecord=BungeeCord 레거시 IP 포워딩. velocity-secret 과 함께 켤 수 없다.
cfg.help.proxy-protocol=true 면 모든 접속이 PROXY 프로토콜(v1·v2) 헤더를 먼저 보내야 한다.
cfg.help.proxy-protocol.trusted=헤더를 보내도 되는 앞단 주소(쉼표로 구분한 IP/CIDR). 주석이면 모두 허용.
cfg.help.io-uring=리눅스 io_uring 으로 접속을 받는다. 못 쓰면 경고하고 epoll/NIO 로 돌아간다.
cfg.help.rcon.max-clients=RCON 동시 연결 수 상한.
cfg.help.rcon.max-clients-per-ip=주소 하나당 동시 연결 수 상한.
cfg.help.rcon.max-fails-per-connection=연결 하나당 인증 실패 허용 수.
cfg.help.rcon.max-fails-per-ip=주소 하나당 60초 인증 실패 허용 수.
cfg.help.metrics.prometheus.enabled=Prometheus 형식 메트릭을 HTTP GET /metrics 로 내보낸다.
cfg.help.metrics.prometheus.bind=바인딩 주소(루프백이 아니면 token 을 꼭 정할 것).
cfg.help.metrics.prometheus.port=포트 번호(0 이면 빈 포트).
cfg.help.metrics.prometheus.token=비어 있지 않으면 Authorization: Bearer <값> 이 맞아야 응답한다.
cfg.help.metrics.jmx.enabled=같은 값을 JMX MBean 으로 등록한다.
cfg.help.idle-pause.empty-seconds=접속자가 없으면 이 초 뒤 게임 틱을 멈춘다. 0 = 끔(바닐라).
cfg.help.idle-pause.flush-caches=일시정지할 때 캐시를 비운다.
cfg.help.backup.interval-minutes=주기 백업 간격(분). 0 = 끔.
cfg.help.backup.keep=남길 백업 수. 0 = 지우지 않음.
cfg.help.backup.format=zip 또는 folder.
cfg.help.backup.skip-if-no-players=지난 백업 뒤 접속자가 없었으면 건너뛴다.
cfg.help.backup.hold-timeout-seconds=백업 기준점에서 저장을 기다리는 최대 초(1~600).
cfg.help.config-version=설정 파일 형식 버전. 키 이름·기본값이 바뀌면 서버가 파일을 옮기고 이 값을 올린다(원본은 .bak). 지우지 마세요.
cfg.help.config.preset=none | vanilla | performance. 기본값 그대로인 키를 프리셋 값으로 바꾼다(기본값과 다르게 적은 키가 이긴다).
cfg.help.jvm.check=기동 때 Java 버전·힙·GC 옵션을 점검해 경고한다.
cfg.help.console.jline=콘솔 줄 편집·기록·Tab 자동완성(터미널이 아니면 자동으로 꺼진다).
cfg.help.console.history-size=콘솔 명령 기록 줄 수. 0 이면 .console_history 파일에 남기지 않는다.
cfg.help.language=서버 메시지(콘솔 로그·콘솔 명령 결과) 언어: auto | en | ko. auto 는 실행 환경(JVM user.language, 리눅스는 LANG)을 따르고, 번역이 없으면 영어. -Dfurnace.language=ko 나 환경변수 FURNACE_LANGUAGE 가 있으면 그쪽이 이긴다. 바닐라·Paper 와 같은 줄(Done (…)! 등)은 늘 영어.
cfg.help.plugins.fail-fast=플러그인 하나라도 불러오기·켜기에 실패하면 서버 시작을 멈춘다.
cfg.help.plugins.data-root=비우면 데이터 폴더 = plugins/<이름>/, 쓰면 <값>/<이름>/.
cfg.help.plugins.dev-mode=개발 모드(플러그인 핫 리로드 /plugins reload <이름>).
cfg.help.plugins.dev-mode.auto-reload=개발 모드에서 plugins/*.jar 가 바뀌면 알아서 다시 읽는다.
cfg.help.plugins.log-level=플러그인별 로그 수준(SEVERE, WARNING, INFO, FINE ...).
cfg.help.plugins.compat.bukkit=Bukkit·Paper 플러그인(plugin.yml) 호환 어댑터. 끄면 plugins/bukkit-plugins/ 와 plugin.yml jar 를 읽지 않는다.
cfg.help.plugins.compat.nms.enabled=Bukkit 호환 플러그인의 NMS·CraftBukkit 이름 변환(CraftBukkit 버전 접미사 v1_21_R1 을 접미사 없는 이름으로). 끄면 그런 이름을 쓰는 플러그인은 그 자리에서 실패한다.
cfg.help.plugins.compat.nms.strict=미지원 NMS 심볼을 쓰는 Bukkit 호환 플러그인은 불러오지 않는다. 끄면 그 호출만 실행 때 실패하고 나머지는 돈다.
cfg.help.plugins.compat.nms.missing-class-log=summary | each. 플러그인이 리플렉션으로 찾다 이 서버에 없는 NMS 클래스를 summary 는 플러그인마다 한 줄로(개수·앞 5개 이름), each 는 이름마다 한 줄로 알린다(ProtocolLib 처럼 이름을 차례로 시도하는 플러그인은 대개 정상).
cfg.help.plugins.compat.nms.version-package=plain | versioned. 플러그인이 읽는 CraftBukkit 패키지 이름(plain = Paper 처럼 접미사 없음, versioned = Spigot 처럼 v1_21_R1).
cfg.help.plugins.compat.nms.spigot-mappings=download | files | off. download(기본)면 Spigot 이름 NMS 플러그인이 있을 때만 Mojang·Spigot 매핑을 처음 한 번 받아 Spigot → Mojang 이름으로 바꿔 올린다(받은 파일은 캐시에만 남는다, 그런 플러그인이 없으면 받지 않는다). files 면 받지 않고 아래 키의 세 파일을 쓴다. off 면 바꾸지 않는다(그 NMS 호출은 실패).
cfg.help.plugins.compat.nms.spigot-mappings.files=spigot-mappings 가 files 일 때: Mojang server.txt, Spigot 클래스 csrg, Spigot 멤버 csrg 경로를 경로 구분자(윈도 ; 그 밖 :)로 이어 적는다.
cfg.help.plugins.chunk-tickets.max-per-plugin=플러그인 하나가 청크 티켓(chunkTickets API)으로 붙잡을 수 있는 청크 수 상한(겹침 포함, 1 이상). 넘으면 add 가 거부된다.
cfg.help.plugins.compat.config.paper-default-separator=Bukkit 설정에서 플러그인이 options().pathSeparator 를 바꿨을 때 addDefault 기본값 트리를 Paper 처럼 언제나 '.' 로 쪼갠다(getDefaults() 구분자도 '.'). 끄면 플러그인이 정한 구분자로 쪼갠다. 켜면 저장 파일 모양·contains·getKeys 와 setDefaults 와 섞어 쓸 때·저장 뒤 다시 읽을 때의 값도 Paper 와 같아진다(Paper 처럼 다시 읽으면 기본값이 빠질 수 있다).
cfg.help.plugins.async-threads=Furnace 플러그인 비동기 작업(asyncExecutor·PluginTasks.async)을 도는 스레드. platform: 이름 붙은 플랫폼 스레드 풀 "Furnace Async Thread - N"(코어 4, 늘어나면 무제한, 30초 놀면 정리). virtual: 가상 스레드(JDK 21 에서는 synchronized 안에서 소켓·파일을 기다리는 옛 DB 드라이버가 운반 스레드를 붙잡아 다른 비동기 작업까지 멈출 수 있다). 접속 전·구성 이벤트는 이 값과 상관없이 따로 "User Authenticator #N" 스레드에서 돈다.
cfg.help.plugins.compat.scheduler.async-threads=Bukkit 비동기 작업(runTaskAsynchronously 등)을 도는 스레드. platform: 이름 붙은 플랫폼 스레드 풀(Paper 와 같은 모양 — 코어 4, 늘어나면 무제한, 30초 놀면 정리). virtual: 가상 스레드(JDK 21 에서는 synchronized 안에서 소켓·파일을 기다리는 옛 DB 드라이버가 운반 스레드를 붙잡을 수 있다).
cfg.help.plugins.compat.libraries=Paper 가 싣는 라이브러리(Guava·Adventure·SnakeYAML·Brigadier 등)를 Furnace jar 에 넣지 않고 필요할 때 받는다. needed: 호환 플러그인 클래스가 쓰는 것만, all: 호환 플러그인이 있으면 전부, off: 받지 않는다(그것을 쓰는 플러그인은 실패).
cfg.help.plugins.compat.libraries.mojang=Brigadier·authlib·DataFixerUpper 는 Mojang 저장소(libraries.minecraft.net)에서 받는다. false 면 그 셋은 빼고 경고.
cfg.help.plugins.compat.libraries.declared=호환 플러그인 plugin.yml 의 libraries 를 Paper·Spigot 처럼 받는다(plugins.libraries.enabled 와 별개).
cfg.help.plugins.libraries.enabled=Furnace 플러그인 설명 파일의 libraries 를 Maven Central 에서 받아 붙인다.
cfg.help.plugins.libraries.offline=캐시에 있는 것만 쓰고 네트워크에 나가지 않는다(위 내려받기 모두에 적용).
cfg.help.plugins.libraries.transitive=라이브러리의 compile/runtime 의존까지 받는다(enabled=true 일 때만).
cfg.help.plugins.libraries.require-checksum=체크섬 기록이 없는 jar 는 받지 않는다(enabled=true 일 때만).
cfg.help.plugins.libraries.cache=받은 라이브러리 폴더. 비우면 plugins/.libraries.
cfg.help.plugins.libraries.timeout-seconds=요청 하나의 제한 시간(1~600초).
cfg.help.plugins.libraries.max-size-mb=파일 하나의 크기 상한(1~1024MB).
