# Furnace 서버 메시지 (한국어). en.properties 와 키·{} 자리 수가 같아야 한다(시험이 확인).
# 바닐라·Paper 문구 그대로인 줄(Done (...)! 등)은 이 파일에 없고 영어로 고정이다. [Backup] 같은 말머리는 검색하기 좋게 영어 그대로 둔다.
# WARN/ERROR 는 "무슨 일 → 서버가 한 일 → 어떻게 하면 되는지" 순서.

# ---- 시작 ----
boot.failed=서버를 시작하지 못해 종료합니다
boot.seeded-test=-Dfurnace.test.seeded=true 는 시험 전용입니다: 난수가 예측 가능해지고 엔티티 UUID 가 부팅마다 겹칠 수 있습니다. 운영 서버에서는 끄세요.
config.migrated=furnace.properties 를 형식 {} → {} 로 옮겼습니다(원본: {}):
config.created=furnace.properties 를 만들었습니다(모든 옵션과 설명)
config.appended=furnace.properties 에 새 옵션을 덧붙였습니다(적어 둔 값은 그대로)
config.write-failed=furnace.properties 를 쓰지 못해 기본값으로 계속합니다: {}
config.language-unknown=언어 값 '{0}'(furnace.properties 의 language, -Dfurnace.language, 환경변수 FURNACE_LANGUAGE 중 하나)은 알 수 없어 영어를 씁니다. 쓸 수 있는 값: {1}
config.zstd=region-file-compression=zstd: 바닐라·Paper 는 이 월드를 읽지 못합니다. 되돌리려면 RegionConvert 도구로 deflate 로 변환하세요.
config.text-filtering-ignored=text-filtering-config 는 지원하지 않아(원격 채팅 필터 서비스 없음) 무시합니다.
config.vanilla-key-ignored=furnace.properties 의 '{}' 는 무시합니다 - server.properties 값을 씁니다.
config.bungee-online-mode=BungeeCord 포워딩이 켜져 있지만 online-mode=true 입니다. BungeeCord 뒤에서는 server.properties 의 online-mode 를 false 로 두세요.
config.light-threads-unused=light.async-threads 는 light.async=true 일 때만 쓰입니다.
config.entity-activation-on=엔티티 활성 범위가 켜져 있습니다(Spigot·Paper 방식, 바닐라와 다름). 바닐라와 같게 하려면 furnace.properties 에서 {} 를 false 로 두세요.
config.entity-handles-differ=Paper 방식 엔티티 기본값이 켜져 있습니다(바닐라와 다름): {}. 바닐라와 같게 하려면 furnace.properties 에 config.preset=vanilla 를 적으세요.
world.import-failed=Paper/Spigot 월드 폴더를 가져오지 못했습니다 - 원본은 그대로입니다. 디스크 공간·권한을 확인하고 다시 시작하세요.
world.level-save-failed=level.dat 를 저장하지 못했습니다
world.dimension-seed={} 는 시드 {} 를 씁니다(dimension-seed 설정 - 바닐라와 다른 지형)
world.autoload-failed=worlds.autoload: 월드 '{}' 를 불러오지 못해 건너뜁니다
world.generator-unsupported=level.dat 의 오버월드 생성기({})는 지원하지 않아 minecraft:overworld 노이즈 설정으로 생성합니다.
world.spawn-prepare-failed=스폰 청크를 준비하지 못했습니다 - 플레이어가 접속할 때 다시 만듭니다
data.vanilla-failed=바닐라 데이터를 준비하지 못해 데이터 팩 없이 시작합니다: {}
data.vanilla-hint=지형·블록은 돌지만 레시피·전리품·발전 과제·데이터 팩 태그는 비어 있습니다. 바닐라 1.21.1 서버 jar 를 {0} 에 두거나 -Dfurnace.vanillaJar=<jar 경로> 로 시작하세요.
data.packs-failed=데이터 팩을 읽지 못해 데이터 팩 없이 시작합니다. 지형·블록은 돌지만 레시피·전리품·발전 과제·데이터 팩 태그는 비어 있습니다.
sched.threads=청크 시스템: 생성 스레드 {}개, region 워커 {}개({}, 차원 {}개)
sched.pool-shared=모든 차원이 공유
sched.pool-per-dimension=차원마다 따로
services.keys-failed=yggdrasil 공개 키를 받지 못했습니다: {}. {} 에 닿을 수 있을 때까지 서명 채팅·채팅 신고를 검증하지 못합니다.

# ---- 실행 중 ----
tick.global-failed=전역 틱이 실패했습니다({}) - 지난 10초 동안 {}번 더
tick.global-failed-once=전역 틱이 실패했습니다({})
backup.schedule=[Backup] {}분마다 {} 로 백업합니다({}, {}개 보관)
backup.keep-all=모두
pause.close-failed=[IdlePause] {} 의 지역 파일을 닫지 못했습니다
pause.paused=[IdlePause] 저장을 마치고 지역 파일 저장소 {}개를 닫은 뒤 GC 를 권했습니다
pause.armed=[IdlePause] 마지막 플레이어가 나가고 {}초 뒤 틱을 멈춥니다(idle-pause.empty-seconds)

# ---- 종료 ----
stop.remote-close-failed=[Stop] 원격 서비스(RCON·Query)를 닫지 못했습니다
stop.save-all-timeout=[Stop] 진행 중이던 save-all 이 30초 안에 끝나지 않아 종료 저장을 이어 갑니다
