warn.velocity-online-mode=velocity-secret is set, so online-mode=true in server.properties is not used (Velocity does the authentication). To avoid confusion set online-mode=false
warn.proxy-and-forwarding=The PROXY protocol (proxy-protocol=true) and {} forwarding are both on: the load balancer in front must send the PROXY header and the proxy behind it the forwarding data, or no connection gets through
warn.trusted-empty=proxy-protocol.trusted is empty: on a server that uses proxy forwarding, list the trusted front addresses to stop forged headers
warn.java-too-old=Running on Java {}: Furnace needs Java 21 or newer
warn.java-not-lts=Java {} is not a long-term-support (LTS) release: security patches stop early. Use Java 21 or 25 on a production server
warn.heap-small=The maximum heap is {}MB: it may be too small for worlds and the chunk cache. Raise it with -Xmx (for example java -Xms4G -Xmx4G -jar furnace-server.jar)
warn.gc-serial=-XX:+UseSerialGC: a single-threaded GC makes ticks stutter on servers with a big heap. Use G1 (the default) or ZGC (-XX:+UseZGC)
warn.gc-parallel=-XX:+UseParallelGC: a throughput-oriented GC with long pauses can make ticks stutter. Use G1 (the default) or ZGC (-XX:+UseZGC)
warn.gc-epsilon=-XX:+UseEpsilonGC: memory is never reclaimed, so the server dies when the heap is full. Unless this is a test, use G1 or ZGC
warn.cpu-few=With {} CPUs the JVM picks the single-threaded Serial GC. Furnace uses threads per region, so giving it more cores helps
warn.xms-lt-xmx=-Xms{0} is smaller than -Xmx{1}: the GC runs often while the heap grows and ticks stutter. Make them equal

