# Furnace server messages (English — the reference language; ko.properties must have the same keys and the same {} slots).
# Rules: vanilla/Paper wording that panels and plugins read ("Done (...)!", "Loading X v1" ...) is NOT in this file — it stays hard-coded English.
# Keep tags such as [Backup] in English in every language so logs stay searchable. A WARN/ERROR says what happened, what the server did, and what to do.

# ---- startup ----
boot.failed=Failed to start the server - shutting down
boot.seeded-test=-Dfurnace.test.seeded=true is for tests only: random numbers become predictable and entity UUIDs can repeat between boots. Turn it off on production servers.
config.migrated=Migrated furnace.properties from format {} to {} (backup: {}):
config.created=Created furnace.properties (every option with its description)
config.appended=Added new options to furnace.properties (the values you wrote are untouched)
config.write-failed=Could not write furnace.properties - continuing with defaults: {}
config.language-unknown=Unknown language '{0}' (from the language setting in furnace.properties, -Dfurnace.language or FURNACE_LANGUAGE) - using English. Available: {1}
config.zstd=region-file-compression=zstd: vanilla and Paper cannot read this world. To go back, convert it to deflate with the RegionConvert tool.
config.text-filtering-ignored=text-filtering-config is not supported (there is no remote chat filter service) - ignoring it.
config.vanilla-key-ignored='{}' in furnace.properties is ignored - the value from server.properties is used.
config.bungee-online-mode=BungeeCord forwarding is on but online-mode=true. Behind BungeeCord, set online-mode=false in server.properties.
config.light-threads-unused=light.async-threads only applies when light.async=true.
config.entity-activation-on=Entity activation range is on (Spigot/Paper style, differs from vanilla). To match vanilla, set {} to false in furnace.properties.
config.entity-handles-differ=Paper-style entity defaults are on (differs from vanilla): {}. To match vanilla, set config.preset=vanilla in furnace.properties.
world.import-failed=Could not import the Paper/Spigot world folder - the original is untouched. Check disk space and permissions, then start again.
world.level-save-failed=Failed to save level.dat
world.dimension-seed={} uses seed {} (dimension-seed setting - terrain differs from vanilla)
world.autoload-failed=worlds.autoload: could not load world '{}' - skipping it
world.generator-unsupported=The overworld generator in level.dat ({}) is not supported - generating with the minecraft:overworld noise settings instead.
world.spawn-prepare-failed=Could not prepare the spawn chunks - they will be generated when a player joins
data.vanilla-failed=Could not prepare the vanilla data, so the server starts without data packs: {}
data.vanilla-hint=Terrain and blocks still work, but recipes, loot tables, advancements and data pack tags are empty. Put the vanilla 1.21.1 server jar at {0} or start with -Dfurnace.vanillaJar=<path to the jar>.
data.packs-failed=Could not read the data packs, so the server starts without them. Terrain and blocks still work, but recipes, loot tables, advancements and data pack tags are empty.
