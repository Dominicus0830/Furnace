cfg.help.io-threads=Number of threads for chunk disk reads and writes.
cfg.help.autosave-ticks=Autosave interval in ticks. 6000 = 5 minutes (vanilla).
cfg.help.chunk-eviction-grace-ticks=Ticks to wait before dropping a chunk nobody is looking at from memory.
cfg.help.entity-view-distance=Distance (in chunks) at which entities are visible. Capped at view-distance if larger.
cfg.help.worlds.autoload=Names of extra worlds to open together with the server (comma separated).
cfg.help.dimension-seed.the_nether=Generation seed of the Nether. If commented out, the main world's seed is used (vanilla). A number or text.
cfg.help.dimension-seed.the_end=Generation seed of the End. Same as above.
cfg.help.worldgen-hooks.overworld=Plugin world generation hook key (namespace:path) to attach to the Overworld. If commented out, vanilla.
cfg.help.worldgen-hooks.the_nether=Plugin world generation hook key to attach to the Nether. Same as above.
cfg.help.worldgen-hooks.the_end=Plugin world generation hook key to attach to the End. Same as above.
cfg.help.worldgen.tick-guard=Generation throttle. If true, the number of concurrent chunk generations is reduced one at a time (down to 1) while the 1-second TPS of the slowest region is below 19, and raised again at 19.8 or above. It protects the TPS floor while a lot of new terrain is generated, at the cost of slower generation (measured, 1st run: lowest TPS 4~6 → 9.8, generation −35%). Even lag unrelated to generation (a big farm in another dimension, etc.) limits all generation to 1. Default false (no throttling).
cfg.help.enchantments.disabled=Enchantment ids to turn off (comma separated, e.g. minecraft:mending). Empty = all enabled (vanilla).
cfg.help.tick-nanos=Length of one tick in nanoseconds. 50000000 = 20 ticks per second (vanilla).
cfg.help.region-threads=Number of threads that run regions (server-wide with the shared pool, per dimension without it). If commented out, the number of CPU cores.
cfg.help.shared-region-pool=If true, all dimensions and extra worlds share one region worker pool. If false, region-threads workers per dimension.
cfg.help.region-pool-dim-cap=Upper limit of workers one dimension may use in the shared pool while other dimensions have work (0 = workers − 1).
cfg.help.region-pool-starve-ticks=When the earliest work of a dimension is delayed by this many ticks, that dimension runs first. 1 or more.
cfg.help.region-section-shift=Section size = 2^value chunks (3 → 8×8 chunks). Different regions are at least 2^value×16+1 blocks apart (129 for 3). 1~8.
cfg.help.region-merge-radius=Sections within this radius (in sections) are merged into the same region. 1 or more.
cfg.help.light.async=If true, a light thread does the light calculation instead of the region thread (the vanilla way). Big light machines such as lamp clocks no longer eat TPS, but when the light thread falls behind, light shows up one or two ticks late as in vanilla overload and sending new chunks is one tick late. Default false (current behavior).
cfg.help.light.async-threads=Number of light threads for light.async (server-wide). 1 or more.
cfg.help.entity-activation-range.enabled=Entity activation range (same approach as Spigot and Paper). If true (default), mobs far from players skip most AI, pathfinding and movement, which makes the server lighter but changes results from vanilla (farms and mob movement far away get slower). If false, identical to vanilla. The values below are Paper's defaults (range unit: blocks, 0 or less = that kind is always active).
cfg.help.merge-radius.item=Radius (in blocks, Spigot style) for merging dropped items. 0.5 (default) = vanilla. Raising it merges items that are farther apart.
cfg.help.merge-radius.exp=Radius (in blocks) for merging experience orbs. 0 or less (default) = vanilla. When on, a new orb absorbs the value of orbs of the same group size within the radius (Spigot, Paper).
cfg.help.collisions.max-entity-collisions=Maximum number of entities one creature pushes per tick (Paper default 8). Farms that herd mobs into a small pen get lighter but results differ from vanilla. -1 = unlimited (vanilla), 0 = pushes nothing. maxEntityCramming damage stays vanilla regardless of this value.
cfg.help.entity-tracking-range.enabled=Per-kind tracking distance (entities are only sent to players within this distance). true (default) = Paper defaults below, false = vanilla (differs per kind). The actual distance is min(this value × entity-broadcast-range-percentage/100, view distance × 16).
cfg.help.item-merge.always-into-ticking=When merging items, always merge into the item that is ticking now (Spigot, Paper). false = vanilla (the smaller stack into the larger one) — which item survives differs.
cfg.help.collisions.skip-unpushable=Creatures that cannot be pushed (mobs hanging on ladders or vines, spectators, etc.) do not push others and take no maxEntityCramming damage (Paper). false = vanilla.
cfg.help.collisions.allow-player-cramming-damage=Whether players take maxEntityCramming damage. false (default, Paper) = packing many players into one spot does not kill them. true = vanilla.
cfg.help.chat.strict-order=If true (vanilla), an out-of-order chat message breaks the signature chain. If false, only that message is dropped.
cfg.help.chat.unsigned-as-system=If true, chat is sent as an unsigned system message (chat reporting is not possible).
cfg.help.server-brand=Server brand shown on the F3 screen.
cfg.help.commands.send-namespaced=If true (default, same as Paper), vanilla command aliases such as minecraft:give show up in tab completion. If false they are hidden but still run when typed.
cfg.help.commands.region-drain=If true (default), when a function or command touches region blocks or entities it is handled right away instead of waiting for the next tick (a #tick function keeps running 20 times per second). It shares the 20 ms per global tick budget with command blocks and goes to the next tick when exceeded. If false, each access line takes one tick.
cfg.help.announce-sleep-status=If false, the action bar with the number of sleeping players is not sent (default true = vanilla).
cfg.help.world.tick-when-empty=Mobs and hoppers in a dimension with no players and no /forceload: vanilla stops them after 15 seconds (vanilla), always keeps them running (Paper and Spigot default), auto (default) is always only when a Bukkit plugin is present.
cfg.help.gravity-block-portal-dupe=If true (default = vanilla), gravity blocks such as sand and gravel that pass through an End portal are also placed in their original spot, duplicating them. If false, they are not duplicated.
cfg.help.motd-format=How the motd of server.properties is interpreted: plain (default, vanilla) | legacy (& color codes) | markup (tags like <gradient:red:blue>…</gradient>).
cfg.help.confirm-interrupt=If true, Ctrl+C in the console must be pressed once more to stop the server.
cfg.help.confirm-interrupt-seconds=Seconds to wait for the second Ctrl+C (1~60).
cfg.help.velocity-secret=Velocity modern forwarding secret. Empty = off.
cfg.help.bungeecord=BungeeCord legacy IP forwarding. Cannot be enabled together with velocity-secret.
cfg.help.proxy-protocol=If true, every connection must send a PROXY protocol (v1 or v2) header first.
cfg.help.proxy-protocol.trusted=Front-end addresses allowed to send the header (comma separated IP/CIDR). If commented out, everyone is allowed.
cfg.help.io-uring=Accept connections with Linux io_uring. If unavailable, warns and falls back to epoll/NIO.
cfg.help.rcon.max-clients=Maximum number of concurrent RCON connections.
cfg.help.rcon.max-clients-per-ip=Maximum concurrent connections per address.
cfg.help.rcon.max-fails-per-connection=Authentication failures allowed per connection.
cfg.help.rcon.max-fails-per-ip=Authentication failures allowed per address within 60 seconds.
cfg.help.metrics.prometheus.enabled=Export Prometheus-format metrics over HTTP GET /metrics.
cfg.help.metrics.prometheus.bind=Bind address (set a token if it is not loopback).
cfg.help.metrics.prometheus.port=Port (0 = any free port).
cfg.help.metrics.prometheus.token=If not empty, the request only gets an answer when Authorization: Bearer <value> matches.
cfg.help.metrics.jmx.enabled=Register the same values as JMX MBeans.
cfg.help.idle-pause.empty-seconds=Stop game ticks after this many seconds with no players. 0 = off (vanilla).
cfg.help.idle-pause.flush-caches=Flush caches when pausing.
cfg.help.backup.interval-minutes=Interval of periodic backups in minutes. 0 = off.
cfg.help.backup.keep=Number of backups to keep. 0 = never delete.
cfg.help.backup.format=zip or folder.
cfg.help.backup.skip-if-no-players=Skip the backup if nobody has been online since the last backup.
cfg.help.backup.hold-timeout-seconds=Maximum seconds to wait for saving at the backup reference point (1~600).
cfg.help.config-version=Version of the config file format. When key names or defaults change, the server migrates the file and raises this value (the original is kept as .bak). Do not delete it.
cfg.help.config.preset=none | vanilla | performance. Replaces keys still at their default with the preset values (keys you wrote with a non-default value win).
cfg.help.jvm.check=Check the Java version, heap and GC options at startup and warn.
cfg.help.console.jline=Console line editing, history and Tab completion (turned off automatically if not a terminal).
cfg.help.console.history-size=Number of console command history lines. 0 = do not keep a .console_history file.
cfg.help.language=Language of server messages (console log and console command results): auto | en | ko. auto follows the runtime environment (JVM user.language, LANG on Linux) and falls back to English if there is no translation. -Dfurnace.language=ko or the environment variable FURNACE_LANGUAGE wins if set. Lines identical to vanilla and Paper (Done (…)! etc.) are always English.
cfg.help.plugins.fail-fast=Stop the server start if even one plugin fails to load or enable.
cfg.help.plugins.data-root=If empty the data folder = plugins/<name>/, otherwise <value>/<name>/.
cfg.help.plugins.dev-mode=Development mode (plugin hot reload with /plugins reload <name>).
cfg.help.plugins.dev-mode.auto-reload=In development mode, reload automatically when plugins/*.jar changes.
cfg.help.plugins.log-level=Log level per plugin (SEVERE, WARNING, INFO, FINE ...).
cfg.help.plugins.compat.bukkit=Compatibility adapter for Bukkit and Paper plugins (plugin.yml). If off, plugins/bukkit-plugins/ and plugin.yml jars are not read.
cfg.help.plugins.compat.nms.enabled=NMS and CraftBukkit name translation for Bukkit-compatible plugins (CraftBukkit version suffix v1_21_R1 to the name without suffix). If off, a plugin that uses such names fails right there.
cfg.help.plugins.compat.nms.strict=Do not load Bukkit-compatible plugins that use unsupported NMS symbols. If off, only that call fails at run time and the rest keeps running.
cfg.help.plugins.compat.nms.missing-class-log=summary | each. Reports NMS classes a plugin looked up by reflection that this server does not have: summary = one line per plugin (count and first 5 names), each = one line per name (plugins that try names one after another, like ProtocolLib, are usually fine).
cfg.help.plugins.compat.nms.version-package=plain | versioned. The CraftBukkit package name plugins read (plain = no suffix like Paper, versioned = v1_21_R1 like Spigot).
cfg.help.plugins.compat.nms.spigot-mappings=download | files | off. download (default): only when there is a plugin using Spigot-named NMS, the Mojang and Spigot mappings are downloaded once and Spigot names are translated to Mojang names when loading (downloaded files stay in the cache only; nothing is downloaded if there is no such plugin). files: no download, the three files of the key below are used. off: no translation (those NMS calls fail).
cfg.help.plugins.compat.nms.spigot-mappings.files=With spigot-mappings=files: paths of the Mojang server.txt, the Spigot class csrg and the Spigot member csrg, joined with the path separator (; on Windows, : elsewhere).
cfg.help.plugins.chunk-tickets.max-per-plugin=Upper limit of chunks one plugin can hold with chunk tickets (chunkTickets API, overlaps included, 1 or more). Above it, add is refused.
cfg.help.plugins.compat.config.paper-default-separator=When a plugin changed options().pathSeparator in a Bukkit config, always split the addDefault default tree at '.' like Paper (the getDefaults() separator is also '.'). If off, it is split at the separator the plugin chose. When on, the saved file shape, contains, getKeys, mixing with setDefaults and the values after saving and re-reading are the same as Paper (as in Paper, defaults can be missing after re-reading).
cfg.help.plugins.async-threads=Threads that run Furnace plugin async work (asyncExecutor, PluginTasks.async). platform: a named platform thread pool "Furnace Async Thread - N" (core 4, unbounded when growing, cleaned up after 30 seconds idle). virtual: virtual threads (on JDK 21, an old DB driver that waits on a socket or file inside synchronized can pin the carrier thread and stall other async work too). Pre-login and configuration events run on separate "User Authenticator #N" threads regardless of this value.
cfg.help.plugins.compat.scheduler.async-threads=Threads that run Bukkit async tasks (runTaskAsynchronously etc.). platform: a named platform thread pool (same shape as Paper — core 4, unbounded when growing, cleaned up after 30 seconds idle). virtual: virtual threads (on JDK 21, an old DB driver that waits on a socket or file inside synchronized can pin the carrier thread).
cfg.help.plugins.compat.libraries=Download the libraries Paper ships (Guava, Adventure, SnakeYAML, Brigadier, etc.) when needed instead of bundling them in the Furnace jar. needed: only what compatible plugin classes use, all: everything if there is a compatible plugin, off: no download (plugins that use them fail).
cfg.help.plugins.compat.libraries.mojang=Brigadier, authlib and DataFixerUpper are downloaded from the Mojang repository (libraries.minecraft.net). If false, those three are left out with a warning.
cfg.help.plugins.compat.libraries.declared=Download the libraries of a compatible plugin's plugin.yml like Paper and Spigot do (separate from plugins.libraries.enabled).
cfg.help.plugins.libraries.enabled=Download the libraries of a Furnace plugin's descriptor file from Maven Central and attach them.
cfg.help.plugins.libraries.offline=Use only what is in the cache and never go to the network (applies to all downloads above).
cfg.help.plugins.libraries.transitive=Also download the compile/runtime dependencies of a library (only when enabled=true).
cfg.help.plugins.libraries.require-checksum=Do not download jars without a recorded checksum (only when enabled=true).
cfg.help.plugins.libraries.cache=Folder for downloaded libraries. If empty, plugins/.libraries.
cfg.help.plugins.libraries.timeout-seconds=Time limit of one request (1~600 seconds).
cfg.help.plugins.libraries.max-size-mb=Size limit of one file (1~1024 MB).
cfg.help.connection.read-timeout-seconds=Seconds before a socket that sends nothing is closed (vanilla 30).
cfg.help.limits.chat-length=Maximum characters of a chat message (1~256, vanilla 256).
cfg.help.limits.command-length=Maximum characters of a command (1~256, vanilla 256).
cfg.help.limits.item.display-name=Limit of characters of an item name sent by the client. 0 = off (vanilla).
cfg.help.limits.item.item-name=Limit of characters of an item's item_name. 0 = off.
cfg.help.limits.item.lore-line=Limit of characters of one item lore line. 0 = off.
cfg.help.limits.item.book-page=Limit of characters of one book page. 0 = off.
cfg.help.limits.item.book-author=Limit of characters of a book author. 0 = off.
cfg.help.activation.animals=Animals (PathfinderMob, bats, etc.).
cfg.help.activation.monsters=Hostile mobs (Enemy).
cfg.help.activation.raiders=Raid mobs (Raider).
cfg.help.activation.misc=Everything else (items, experience orbs, arrows, clouds, etc.).
cfg.help.activation.water=Water animals (WaterAnimal).
cfg.help.activation.villagers=Villagers.
cfg.help.activation.flying-monsters=Flying hostile mobs (ghast, phantom).
cfg.help.activation.wake-up-inactive.animals-max-per-tick=Number of inactive animals to wake up (a cap that grows by 1 every tick).
cfg.help.activation.wake-up-inactive.animals-every=Animals inactive for longer than this many ticks are candidates to be woken up.
cfg.help.activation.wake-up-inactive.animals-for=Ticks a woken animal stays active.
cfg.help.activation.wake-up-inactive.monsters-max-per-tick=Cap on the number of inactive hostile mobs (raid mobs included) to wake up.
cfg.help.activation.wake-up-inactive.monsters-every=Interval (ticks) for waking up hostile mobs.
cfg.help.activation.wake-up-inactive.monsters-for=Ticks a woken hostile mob stays active.
cfg.help.activation.wake-up-inactive.villagers-max-per-tick=Cap on the number of inactive villagers to wake up.
cfg.help.activation.wake-up-inactive.villagers-every=Interval (ticks) for waking up villagers.
cfg.help.activation.wake-up-inactive.villagers-for=Ticks a woken villager stays active.
cfg.help.activation.wake-up-inactive.flying-monsters-max-per-tick=Cap on the number of inactive flying hostile mobs to wake up.
cfg.help.activation.wake-up-inactive.flying-monsters-every=Interval (ticks) for waking up flying hostile mobs.
cfg.help.activation.wake-up-inactive.flying-monsters-for=Ticks a woken flying hostile mob stays active.
cfg.help.activation.villagers-work-immunity-after=A villager inactive for more than this many ticks and working is briefly made active (0 or less = off).
cfg.help.activation.villagers-work-immunity-for=Ticks a working villager stays active.
cfg.help.activation.tick-inactive-villagers=Inactive villagers still run their brain (schedule, memory). If false, only things like trade timers run without a brain.
cfg.help.activation.ignore-spectators=Do not make the area around spectators active.
cfg.help.activation.villagers-active-for-panic=Villagers hiding, before a raid, in a raid or in panic are active for 5 seconds.
cfg.help.tracking.players=Players (vanilla 512)
cfg.help.tracking.animals=Animals, water animals and villagers (vanilla differs per kind — cow 160, fish 64, etc.)
cfg.help.tracking.monsters=Hostile mobs, raid mobs and flying hostile mobs (ender dragon included, vanilla differs per kind — zombie 128, dragon 160, etc.)
cfg.help.tracking.misc=Dropped items, experience orbs, paintings and item frames (vanilla item and orb 96, painting and frame 160)
cfg.help.tracking.display=Display entities (vanilla 160)
cfg.help.tracking.other=Everything else (arrows, vehicles, explosives, armor stands, etc., vanilla differs per kind)
