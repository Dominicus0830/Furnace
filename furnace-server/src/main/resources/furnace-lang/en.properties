level.newer-version={}: this world was saved by a newer version ({}, data version {}). This server is 1.21.1 (data version {}); opening it would delete unknown blocks and items, so it does not start - the world files were not touched. Use a world or backup made on 1.21.1, or accept the loss and force it with -D{}=true
level.older-version={}: this world was saved by an older version ({}, data version {}). This server is 1.21.1 (data version {}) and has no data fixers for older chunks and players yet, so opening it would silently lose item counts, enchantments and blocks - it does not start and the world files were not touched. Use a world opened and saved once with vanilla 1.21.1, or accept the loss and force it with -D{}=true
