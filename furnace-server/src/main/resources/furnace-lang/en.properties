warn.bungee-unsigned=BungeeCord legacy forwarding (bungeecord=true) has no signature: unless a firewall or the PROXY protocol trust list blocks direct connections that bypass the proxy, anyone can join with any name, UUID and IP. If you need signing, use Velocity forwarding (velocity-secret)
