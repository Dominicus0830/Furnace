nms.unsaved-section-kept=[NMS] Chunk {}, {} ({}) is being unloaded with sections a plugin changed without marking them unsaved - scheduled ticks remain, so this chunk is saved and the change is saved with it (without the unsaved mark it may not persist on Paper). To keep the change for certain, the plugin should call LevelChunk#setUnsaved(true) (or markUnsaved){}
nms.unsaved-section-dropped=[NMS] Chunk {}, {} ({}) is being unloaded with sections a plugin changed without marking them unsaved - like vanilla and Paper, that change is not saved (the old blocks come back when it is loaded again). To keep it, the plugin should call LevelChunk#setUnsaved(true) (or markUnsaved){}
