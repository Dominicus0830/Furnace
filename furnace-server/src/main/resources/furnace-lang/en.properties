# Furnace server messages (English — the reference language; ko.properties must have the same keys and the same {} slots).
# Rules: vanilla/Paper wording that panels and plugins read ("Done (...)!", "Loading X v1" ...) is NOT in this file — it stays hard-coded English.
# Keep tags such as [Backup] in English in every language so logs stay searchable. A WARN/ERROR says what happened, what the server did, and what to do.

