plugin.compat-libs-off=plugins.compat.libraries=off - the libraries Paper ships (Guava, Adventure, SnakeYAML, Brigadier, ...) are not provided, so Paper/Bukkit plugins that use them fail with NoClassDefFoundError.
plugin.compat-libs-off-core=The compatibility layer itself expects {0}, so Bukkit compatibility will not work properly.
plugin.libraries-scan-failed=Could not scan the jar of plugin {0}, so the server-provided library check is skipped: {1}
plugin.server-libs-prepare=Preparing the server-provided libraries {0} for Paper/Bukkit plugins (first requested by {1}, plugins.compat.libraries={2})
plugin.server-lib-mojang-only=The server-provided library {0} ({1}) is only on Mojang's repository and plugins.compat.libraries.mojang=false, so it is not downloaded. Paper/Bukkit plugins that use it (first: {2}) may fail with NoClassDefFoundError.
plugin.server-lib-failed=Could not prepare the server-provided library {0} ({1}) - {2}: {3}. Paper/Bukkit plugins that use it (first: {4}) may fail with NoClassDefFoundError. On an offline server, put the file from {5} at {6} (only a file with sha256 {7} is used).
plugin.core-lib-failed=Could not prepare {0}, a library the Bukkit/Paper compatibility layer expects. Bukkit plugins that use compatibility classes with that type in their signatures, or scan them by reflection, fail with NoClassDefFoundError. On an offline server, put the jar under {1} and set plugins.libraries.offline=true.
plugin.libs-unreachable=The repository was already unreachable earlier in this start, so the server-provided library {0} was not downloaded either (the server does not wait for a timeout per bundle). On an offline server, put the jar under {1} and set plugins.libraries.offline=true.
plugin.spigot-mappings-skipped=Not downloading the Spigot name mappings this start - {0}. NMS calls of plugins compiled against Spigot names (first: {1}) will fail. On an offline server, put the files in {2} (if they are there, the server uses them instead of downloading).
plugin.spigot-mappings-failed=Could not prepare the Spigot name mappings - {0}. NMS calls of plugins compiled against Spigot names (first: {1}) will fail. On an offline server, put the files in {2} and set plugins.libraries.offline=true (if the failure was a connection problem, the next few starts skip the download for a while).
plugin.api-version-missing=Plugin {0} has no api-version - assuming the current API ({1}). Add api-version to its furnace-plugin descriptor.
plugin.api-version-unreadable=Plugin {0}: cannot read api-version '{1}' - assuming the current API ({2}).
plugin.api-old=Plugin {0} was built for an old API {1} (server {2}, oldest supported {3}) - update the plugin.

