junit.jupiter.extensions.autodetection.enabled=true
# 시험 한 개(@BeforeAll 등 준비·정리 메서드 포함)의 기본 제한시간. 멈춘 시험(교착·무한 반복)이 CI 작업 제한(35분)까지 가지 않게 한다(A19-01).
# 정상 시험의 최장은 약 67초(TreeFeatureScanTest, 2026-11-11 4코어 전체 시험 3854개 실측)·클래스 합은 약 124초라 5분은 넉넉하다.
# 더 오래 걸려야 하는 시험은 그 시험에 @Timeout 을 붙인다. 메서드에 붙은 @Timeout 이 이 값보다 우선한다.
junit.jupiter.execution.timeout.default=5m
# 시험을 따로 만든 스레드에서 돌려, 인터럽트로 안 멈추는 무한 반복도 제한시간에 맞춰 실패로 끝나게 한다(같은 스레드 방식은 인터럽트만 건다).
junit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD
