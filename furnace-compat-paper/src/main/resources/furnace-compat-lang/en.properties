# 호환 계층(furnace-compat-paper) 운영자 메시지. 서버 furnace-lang 과 같은 규칙({} / {0} 자리, 영어 기준)이고 CompatLang 이 읽는다.
compat.paper-bootstrap-ignored=dependencies.bootstrap in paper-plugin.yml is not read (outside the first scope of the Furnace compat adapter): {}
compat.paper-key-not-run='{}' in paper-plugin.yml is not run by the Furnace compat adapter - this plugin will not work properly if it depends on it
compat.spigot-files-count=Plugin {0}: {1} must be three files (Mojang server.txt, Spigot class csrg, member csrg) - Spigot names are not remapped
compat.spigot-mappings-unreadable=Plugin {0}: could not read the Spigot name table ({1}) - Spigot names are not remapped (those NMS calls will fail)
compat.create-world-hardcore=[Furnace] createWorld('{}'): hardcore(true) is ignored - extra Furnace worlds follow the main world's hardcore value (server.properties hardcore)
compat.create-world-flat-no-layers=[Furnace] createWorld('{}'): the flat generatorSettings has no layers - building the default flat world (same as Paper)
compat.create-world-provider-dropped=[Furnace] createWorld('{}'): this world was created with the biome provider {} but none was given now - new chunks use vanilla biomes (same as Paper)
compat.create-world-generator-dropped=[Furnace] createWorld('{}'): this world was created with the chunk generator {} but none was given now - new chunks use the vanilla generator (same as Paper)
compat.populator-legacy-not-called=[Furnace] BlockPopulator {} only overrides the old populate(World, Random, Chunk), which Furnace does not call yet - override populate(WorldInfo, Random, int, int, LimitedRegion) instead
compat.generate-tree-unloaded=World#generateTree: chunk ({0}, {1}) is not loaded, so no tree is grown and false is returned
compat.generate-tree-failed=World#generateTree({0}): {1} - no tree is grown and false is returned
compat.mirror.request-failed=Could not ask the owner to sync ({}) - the end-of-tick sweep on the next tick will sync it
compat.mirror.null-section=Section array slot {} received null - not taken in (a section of a loaded vanilla chunk is never null)
compat.mirror.invalid-section=Content of section {0} is not taken in: {1} - vanilla also fails to read such a section. Check the section or container the plugin made
compat.mirror.replay-failed=Could not replay a cell written from another thread ({}) - that write is dropped
compat.mirror.unload-failed=Could not freeze the sections of the unloading chunk ({})
compat.mirror.bind-failed=Could not attach a block entity view obtained on another thread to its block entity ({}) - saving that view may fail later
compat.mirror.line=[NMS] Chunk {0}, {1} ({2}) mirror: {3}
compat.nms-report-failed=Plugin {0}: could not create the NMS compatibility report ({1}) - transforming anyway
compat.nms-version-suffix=Plugin {0}: CraftBukkit versioned names ({1}) are rewritten to this server's unversioned names when loaded
compat.nms-hint-spigot-mapped=Spigot names are rewritten to Mojang names with the Spigot-to-Mojang name table (plugins.compat.nms.spigot-mappings).
compat.nms-hint-unresolved-obfuscated={} obfuscated-name members the table could not resolve will fail when called.
compat.nms-hint-spigot-jar=Looks like a jar with Spigot names - without a Spigot-to-Mojang name table, calls to names missing from the shim fail. With plugins.compat.nms.spigot-mappings=download in furnace.properties (the default) the Mojang and Spigot mappings are fetched once and applied (if it is already download, see the download-failure warning in the startup log).
compat.nms-hint-spigot-jar-obfuscated=Looks like a jar with Spigot names ({} obfuscated-name members) - without a Spigot-to-Mojang name table, calls to names missing from the shim fail. With plugins.compat.nms.spigot-mappings=download in furnace.properties (the default) the Mojang and Spigot mappings are fetched once and applied (if it is already download, see the download-failure warning in the startup log).
compat.nms-hint-obfuscated={} members that look obfuscated will fail when called.
compat.nms-other-version={0} classes of other-version or unused adapter modules and {1} other-version names are not used by this server and were not counted.
compat.nms-summary=Plugin {0}: of {1} NMS/CraftBukkit symbols, {2} have a shim, grade C {3}, not available yet {4}. Naming scheme={5}.{6}{7}
compat.nms-unsupported-symbols=Plugin {0}: {1} unsupported NMS symbols (first {2}): {3} - UnsupportedNmsCall is thrown only when that call runs (the rest of the features work)
compat.nms-class-inherits=Plugin {0}: class {1} is not defined - {2} is inherited: {3}
compat.nms-class-husk=Plugin {0}: class {1} cannot be created - it extends {2}, which Furnace does not support: {3}
compat.nms-datafix-unsupported=Data fixing ({0} {1} -> {2}): the Furnace data fixer covers block states, block/item names, item stacks, block entities and entities from data version 1452 up to this server's data version (3955) only, so this value is left as it is. Shown once
compat.nms-ticket-owner-missing=Plugin {0}: could not find the plugin that owns an NMS chunk ticket, so the ticket was not added
compat.nms-ticket-add-failed=NMS chunk ticket {0} ({1}, {2}) level {3} could not be added: {4}
compat.nms-missing-more=and {} more
compat.nms-missing-summary=Plugin {0} looked up {1} NMS classes by reflection that this server does not have, and got ClassNotFoundException as it is: {2} - usually this is feature detection that tries names one after another, so they are missing on Paper 1.21.1 too and this is normal. Only if a feature of that plugin does not work, set {3}=each in furnace.properties to see every name
compat.nms-missing-summary-starting=Plugin {0} looked up {1} NMS classes by reflection while starting that this server does not have, and got ClassNotFoundException as it is: {2} - usually this is feature detection that tries names one after another, so they are missing on Paper 1.21.1 too and this is normal. Only if a feature of that plugin does not work, set {3}=each in furnace.properties to see every name
compat.nms-class-not-found=Plugin {0} looked up the NMS class {1} by reflection but this server does not have it - {2} (ClassNotFoundException is passed through as it is)
compat.nms-member-not-found=Plugin {0} looked up the NMS member {1} by reflection but the shim does not have it - the original exception is passed through
compat.nms-unsupported-call=Unsupported NMS call: plugin={0}, call site={1}, target={2} - {3} (the next call to the same target is logged at DEBUG)
compat.load-plugins-ignored=Furnace does not load new plugins while the server is running - loadPlugins({}) loaded nothing
compat.load-plugins-ignored-list=Furnace does not load new plugins while the server is running - loadPlugins loaded nothing
compat.event-shell-skipped=Skipped the event handler for {0} in {1}: Furnace has only the shape of this Paper event yet (full shell, T-260) and does not fire it; the other handlers of the listener are registered. (events supported by the Furnace compat adapter: docs/api/compat-paper.md)
compat.event-list-hint=(events supported by the Furnace compat adapter: docs/api/compat-paper.md)
compat.nms-namespace-assumed=Spigot (assumed - no paperweight-mappings-namespace in the manifest)
compat.pipeline-not-bridged=Plugin {0} tries to hook the packet pipeline (ServerConnectionListener). Furnace does not bridge the server socket or pre-login interception - features that need to see that stage (handshake, status, login) do not work. Packets sent to connected players are partly bridged (sendServerPacket, connection.send and outgoing interception); packets the server sends on its own and incoming-packet interception are not yet (docs/feature-parity/compat-protocollib-pipeline-2b-plan-2026-11-12.md). Use the Furnace packet API (docs/api/packets.md) instead.
compat.channel-write-failed=Plugin {0} wrote a packet through connection.channel that could not be sent (first error): {1}
compat.channel-write-wire=Plugin {0} sent a byte wire packet (ProtocolLib sendWirePacket etc.) that is not supported yet and was dropped - use the Furnace packet API (docs/api/packets.md)
compat.channel-write-other=Plugin {0} sent a value that is not a packet ({1}) that is not supported yet and was dropped - use the Furnace packet API (docs/api/packets.md)
compat.event-not-fired=A handler for {} was registered but the Furnace server does not fire this event yet - that handler will not be called (supported list: docs/api/compat-paper.md)
compat.no-api-version=plugin.yml has no api-version - this looks like a pre-1.13 legacy plugin, but Furnace does not convert legacy Materials. Add api-version: '1.21' and rebuild
compat.tilestate-pdc-gone=Plugin {0} changed persistent data through getState(false) on a position whose block entity is gone - it is not kept on the block (same as Paper)
compat.known-commands-put=knownCommands.put("{0}") - '{1}' is already a vanilla or other plugin's command, so it is not overwritten and was only added as '{2}' (Paper overwrites it)
compat.legacy-block-data=Plugin {0} created a block state from a legacy block data value (non-zero) - Furnace does not support legacy data values (the flattening table), so it is ignored and the default state is used (for example red wool WOOL,14 becomes white wool). Switch to BlockData
compat.tilestate-live-name=Plugin {0} changed the name of a getState(false) state - in Furnace update() must be called for it to reach the block (Paper applies it immediately)
compat.tilestate-no-block-entity=Plugin {0} updated a {1} block state, but Furnace has no such block entity so the name and persistent data were not applied
compat.pl-track-failed=The ProtocolLib bridge could not pre-wrap an entity that came into view (first error): {}
compat.pl-out-unshowable=Furnace {0} packets that contain the value kind '{1}' cannot be shown to ProtocolLib listeners (sent as they are, first case)
compat.pl-out-show-failed=Could not show a Furnace {0} packet to ProtocolLib listeners (first error): {1}
compat.pl-out-intercept-error=Error during ProtocolLib interception ({0}, the original packet is sent): {1}
compat.pl-out-convert-back-failed=Could not convert the {0} packet changed by a ProtocolLib listener back to a Furnace packet, so the original packet from before the change is sent (first error): {1}
compat.pl-out-write-failed=Could not write the {0} packet changed by a ProtocolLib listener, so the original packet is sent (first error): {1}
compat.pl-in-show-failed=Could not show a client {0} packet to ProtocolLib listeners (the server handles it as it is, first error): {1}
compat.pl-in-intercept-error=Error during ProtocolLib incoming interception ({0}, the original packet is handled): {1}
compat.pl-in-convert-back-failed=Could not convert the {0} packet changed by a ProtocolLib listener back to a Furnace packet, so the original packet is handled (first error): {1}
compat.pl-in-inject-failed=Could not feed the packet changed by a ProtocolLib listener ({0}) into the server (first error): {1}
compat.pl-in-write-failed=Could not write the {0} packet changed by a ProtocolLib listener, so the original packet is handled (first error): {1}
compat.pl-send-failed=Could not send the packet changed by a ProtocolLib listener ({0}) (first error): {1}
compat.pl-listen-missing-out=Packet types ProtocolLib listeners listen to that Furnace cannot show yet when it sends them itself (packets sent by plugins are shown): {}
compat.pl-listen-needs-setting=Packet types ProtocolLib listeners listen to that can only be shown with a server setting (until then these packets from Furnace do not pass through the listeners): {}
compat.pl-listen-missing-in=Packet types ProtocolLib listeners listen to that cannot be shown yet when the client sends them (the server handles them as they are): {}
# NMS grade texts and compat warnings (PR12)
compat.clock-shared=World#{0}({1}): Furnace shares the time, weather and spawn of the Overworld between all worlds - a change on a world other than the Overworld was ignored
compat.send-distance-ignored=World#setSendViewDistance({}): Furnace has no per-world send distance - ignored. Use Player#setSendViewDistance per player, or view-distance in server.properties for everyone
compat.distance-shared=World#{0}({1}): the view and simulation distance of Furnace is one value for the whole server - a change on a world other than the main Overworld was ignored (calling it on the main Overworld changes all worlds)
compat.keep-spawn-shared=World#setKeepSpawnInMemory({}): Furnace has one game rule (spawnChunkRadius) for the whole server, so a change on a world other than the main Overworld was ignored
compat.tab-timeout=Tab completion did not finish within {0} ms and is skipped: /{1}
compat.tab-failed=Tab completion failed: /{}
compat.default-config-unreadable=Could not read the default config.yml
compat.alias-skipped=Command /{0}: the alias '{1}' cannot be put on the Furnace command tree and is skipped
compat.scheduled-task-failed={} - the scheduled task failed
compat.protocollib-bridge-failed=Could not turn on the ProtocolLib bridge (showing the packets the server sends)
compat.protocollib-listeners-failed=Could not read the ProtocolLib listener list - packets the server sends are not visible to listeners
compat.unreadable-kind=a kind whose content this server cannot read
nms.grade-c=Grade C - {}
nms.no-craftbukkit=Not in the CraftBukkit adapter yet (docs/feature-parity/compat-h6-2026-11-07.md)
nms.no-shim=Not in the NMS shim yet (docs/feature-parity/compat-h7-2026-11-08.md). For Spigot names, a Spigot -> Mojang name table is needed (plugins.compat.nms.spigot-mappings=download, the default - look for a download failure warning in the startup log)
nms.grade-c.inherit=extending NMS classes is not supported (the server never calls those virtual methods). Use instead: the Furnace entity, mob AI and menu APIs
nms.grade-c.chunk=field and array level access inside chunks (building or writing sections and palettes directly, ProtoChunk) differs from Furnace's chunk storage and region split and is not available yet - method level reads (LevelChunk, LevelChunkSection, PalettedContainer views) are. Use instead: Level#setBlock, the Furnace block API, Internals#withLevel, the W3 worldgen hooks
nms.grade-c.lighting=the light engine internals differ. Use instead: the Furnace light API (docs/api/light-sources.md)
nms.grade-c.chunk-map=chunk loading and tracking internals differ. Use instead: the chunk ticket API (docs/api/chunk-tickets.md)
nms.grade-c.chunk-cache=chunk loading and tracking internals differ (getting loaded chunks with getChunk and getChunkNow works). Use instead: the chunk ticket API (docs/api/chunk-tickets.md)
nms.grade-c.levelgen=world generation internals differ. Use instead: the W3 worldgen hooks (docs/api/worldgen-hooks.md)
nms.grade-c.mob-ai=mob AI internals (goals, brain) differ. Use instead: the Furnace mob AI API (docs/api/mob-ai.md)
nms.grade-c.menu=menu internals have a different shape from the Furnace menu framework. Use instead: the Furnace menu API
nms.grade-c.reload=data pack reload internals differ. Use instead: the C2 function hooks and the W2 registry (docs/api/function-hooks.md)
nms.grade-c.packs=data pack reload internals differ. Use instead: the C2 function hooks and the W2 registry (docs/api/function-hooks.md)
nms.grade-c.entity-storage=entity storage and tick list internals conflict with the multithreaded region model. Use instead: the Furnace entity API
nms.strict-refused=plugins.compat.nms.strict=true and there are {0} unsupported NMS symbols (first ones: {1}). Turn strict off and only those features fail while the rest keeps running
nms.report.packet-ctor={0}#<init>({1}) - constructing the packet works, sending is not supported
nms.report.extends=extends {0} -> {1}
nms.authlib-missing=authlib (GameProfile) is not on the server - the server downloads it when a plugin uses authlib (furnace.properties plugins.compat.libraries.mojang=true, and libraries.minecraft.net must be reachable)

compat.retired-callback-failed=The retired callback of a scheduled task failed
compat.nms.effect-failed=Plugin {0}: {1} called from another thread failed on the owning region ({2}) - that side effect did not happen
compat.profile-uuid-changed=Plugin {0} called setPlayerProfile for {1} with a different UUID ({2}) than the player's UUID ({3}). Other players' clients can fail to show this player and a tab-list entry can stay behind after the player quits - Paper behaves the same way. This is shown once
compat.profile-uuid-changed-unknown=setPlayerProfile was called for {0} with a different UUID ({1}) than the player's UUID ({2}). Other players' clients can fail to show this player and a tab-list entry can stay behind after the player quits - Paper behaves the same way. This is shown once
compat.nms.registries-failed=Could not prepare the vanilla registries for NMS plugins: {0}. NMS calls that use them will fail
