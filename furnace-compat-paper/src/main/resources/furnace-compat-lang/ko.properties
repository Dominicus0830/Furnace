nms.no-shim=NMS shim 에 아직 없다(docs/feature-parity/compat-h7-2026-11-08.md). Spigot 이름이면 Spigot → Mojang 대응표가 필요하다(plugins.compat.nms.spigot-mappings=download, 기본 — 시작 로그에서 받기 실패 경고를 보라)
nms.grade-c.inherit=NMS 클래스 상속은 지원하지 않는다(서버가 그 가상 메서드를 부르지 않는다). 대체: Furnace 엔티티·몹 AI·메뉴 API
nms.grade-c.chunk=청크 내부의 필드·배열 수준 접근(섹션·팔레트 직접 만들기·쓰기, ProtoChunk)은 Furnace 의 청크 저장·region 분할과 달라 아직 없다 — 메서드 수준 읽기(LevelChunk·LevelChunkSection·PalettedContainer 보기)는 있다. 대체: Level#setBlock·Furnace 블록 API·Internals#withLevel·W3 월드젠 훅
nms.grade-c.lighting=빛 엔진 내부가 다르다. 대체: Furnace 빛 API(docs/api/light-sources.md)
nms.grade-c.chunk-map=청크 적재·추적 내부가 다르다. 대체: 청크 티켓 API(docs/api/chunk-tickets.md)
nms.grade-c.chunk-cache=청크 적재·추적 내부가 다르다(로드된 청크 얻기 getChunk·getChunkNow 는 있다). 대체: 청크 티켓 API(docs/api/chunk-tickets.md)
nms.grade-c.levelgen=월드 생성 내부가 다르다. 대체: W3 월드젠 훅(docs/api/worldgen-hooks.md)
nms.grade-c.mob-ai=몹 AI 내부(목표·뇌)가 다르다. 대체: Furnace 몹 AI API(docs/api/mob-ai.md)
nms.grade-c.menu=메뉴 내부가 Furnace 메뉴 프레임워크와 모양이 다르다. 대체: Furnace 메뉴 API
nms.grade-c.reload=데이터 팩 재적재 내부가 다르다. 대체: C2 함수 훅·W2 레지스트리(docs/api/function-hooks.md)
nms.grade-c.packs=데이터 팩 재적재 내부가 다르다. 대체: C2 함수 훅·W2 레지스트리(docs/api/function-hooks.md)
nms.grade-c.entity-storage=엔티티 저장·틱 목록 내부가 멀티스레드 region 모델과 충돌한다. 대체: Furnace 엔티티 API
nms.strict-refused=plugins.compat.nms.strict=true 이고 미지원 NMS 심볼이 {0}개 있다(처음 것: {1}). strict 를 끄면 그 기능만 실패하고 나머지는 돈다
nms.report.packet-ctor={0}#<init>({1}) — 생성 패킷, 보내기 미지원
nms.report.extends=상속 {0} → {1}
nms.authlib-missing=authlib(GameProfile)이 서버에 없다 — authlib 을 쓰는 플러그인이 있으면 서버가 받는다(furnace.properties plugins.compat.libraries.mojang=true, libraries.minecraft.net 에 닿아야 한다)

compat.retired-callback-failed=예약 작업의 퇴역 콜백이 실패했다
compat.nms.effect-failed=플러그인 {0}: 다른 스레드에서 부른 {1} 이(가) 주인 region 에서 실패했다({2}) — 그 부수 효과는 일어나지 않았다
compat.profile-uuid-changed=플러그인 {0} 이(가) {1} 에게 setPlayerProfile 을 부르며 플레이어 UUID({3})와 다른 UUID({2})를 넣었다. 다른 플레이어의 화면에 이 플레이어가 안 보일 수 있고 퇴장 뒤 탭 항목이 남을 수 있다 — Paper 도 같다. 이 경고는 한 번만 나온다
compat.profile-uuid-changed-unknown=setPlayerProfile 이 {0} 에게 플레이어 UUID({2})와 다른 UUID({1})로 불렸다. 다른 플레이어의 화면에 이 플레이어가 안 보일 수 있고 퇴장 뒤 탭 항목이 남을 수 있다 — Paper 도 같다. 이 경고는 한 번만 나온다
compat.nms.registries-failed=NMS 플러그인용 바닐라 레지스트리를 준비하지 못했다: {0}. 그 레지스트리를 쓰는 NMS 호출은 실패한다
