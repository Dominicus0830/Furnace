name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Paper 저장소 없이 돌리므로 oracle 모듈은 건너뛴다
      - name: 서버 테스트
        run: ./gradlew -PskipOracle=true :furnace-server:test
