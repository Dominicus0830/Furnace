name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Paper 저장소 없이 돌리므로 oracle 모듈은 건너뛴다(-PskipOracle=true)
      - name: API 테스트
        run: ./gradlew -PskipOracle=true :furnace-api:test
      # 샘플 플러그인이 공개 API 만으로 컴파일되는지(테스트 코드는 없다)
      - name: 플러그인 샘플 컴파일
        run: ./gradlew -PskipOracle=true :furnace-plugin-test:classes
      - name: 서버 테스트
        run: ./gradlew -PskipOracle=true :furnace-server:test
      # 헤드리스 시험 서버(플러그인 개발자용 시험 라이브러리) 자체 시험
      - name: 시험 서버 모듈 테스트
        run: ./gradlew -PskipOracle=true :furnace-test:test
      # 단일 실행 jar 가 만들어지는지(실행 검사는 아님). 러너·캐시·브랜치 정책은 사용자 결정 전이라 바꾸지 않았다.
      - name: fatJar 빌드
        run: ./gradlew -PskipOracle=true :furnace-server:fatJar
