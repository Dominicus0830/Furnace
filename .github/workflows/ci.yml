name: CI

# 실행 구조 (2026-11-07 병합 병목 개선)
#  - 서버 시험(약 12분, 3500개)은 시험 클래스 해시로 3조각(-PtestShard=i/3)으로 나눠 러너 3대에서 동시에 돌린다.
#  - 실패한 조각은 전체가 아니라 "처음에 실패한 시험 클래스만" 한 번 다시 돌린다(부하에서만 실패하는 시간 민감 시험 대응, 재시도 비용 12분 → 1분 안팎).
#    다시 돌려도 실패하면 진짜 실패로 처리하고, 재시도에서 통과한 시험은 "흔들린 시험" 주석·실행 요약·산출물(flaky-tests-N)로 남긴다.
#    제한시간을 넘긴 시험·@NoRetry 시험의 실패는 재시도하지 않는다(멈춘 시험·확률 실패를 가리지 않게). 자세한 규칙은 docs/ci.md.
#  - 나머지(API 시험·샘플 플러그인 컴파일·시험 서버 모듈·fatJar)는 light 작업으로 동시에 돈다.
#  - 합쳐진 판정은 이름이 `test` 인 마지막 작업 하나다(기존 점검 이름 유지).
#  - push 는 기준 브랜치에서만 돈다. 작업 브랜치는 pull_request 로 한 번만 돈다(전에는 push 와 pull_request 가 둘 다 돌아 같은 시험이 두 번 돌았다).
#    충돌이 있는 PR 은 pull_request 실행이 만들어지지 않으니 기준 브랜치를 합쳐 충돌부터 푼다.
on:
  push:
    branches:
      - claude/quirky-wright-lra834   # 기준 브랜치가 바뀌면 이 이름과 아래 BASE_BRANCH 둘 다 바꾼다
      - main
  pull_request:

# 같은 PR·브랜치에 새 푸시가 오면 앞선 실행을 취소해 러너 부하(시간에 민감한 시험의 불안정 원인)를 줄인다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR 은 새 푸시가 오면 앞 실행을 취소한다. 기준 브랜치 push 실행은 취소하지 않는다 — 병합이 15분보다 자주 일어나도 기준 브랜치 실행(캐시 저장·user-todo 합친 문서)이 끝까지 돌게.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_BRANCH: refs/heads/claude/quirky-wright-lra834

jobs:
  server-tests:
    name: server-tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # 기본값은 "기본 브랜치(main)에서만 캐시 저장"이라 기준 브랜치 캐시가 한 번도 안 만들어졌다. 기준 브랜치 실행에서만 저장한다.
          cache-read-only: ${{ github.ref != env.BASE_BRANCH }}
      # Paper 저장소 없이 돌리므로 oracle 모듈은 건너뛴다(-PskipOracle=true)
      - name: 서버 테스트 (조각 ${{ matrix.shard }}/3)
        id: server-test
        continue-on-error: true
        # 멈춘 시험이 작업 제한(35분)까지 가지 않게 단계에도 제한을 둔다(정상 조각은 5~8분). 시험 한 개의 기본 제한시간은
        # furnace-server/src/test/resources/junit-platform.properties 에 있고, 이 제한은 그 위의 마지막 방어선이다.
        # 단계 제한으로 끝나면 재시도 없이 실패하고 보고서·실행 로그는 올라간다.
        timeout-minutes: 20
        run: |
          set -o pipefail
          ./gradlew -PskipOracle=true -PtestShard=${{ matrix.shard }}/3 :furnace-server:test 2>&1 | tee /tmp/shard-run.log
      # 부하에서 가끔 실패하는 시간 민감 시험(CommandBlockOneTickTest 등): 처음에 실패한 시험 클래스만 한 번 다시 돌린다.
      # 재시도하지 않는 경우(JVM 이상 종료, 제한시간 초과, @NoRetry 실패)와 흔들린 시험 기록은 tools/ci/retry-failed-tests.sh 에 있다.
      - name: 실패한 시험만 재시도(1회)
        id: retry
        if: steps.server-test.outcome == 'failure'
        run: tools/ci/retry-failed-tests.sh ${{ matrix.shard }}
      # 재시도에서 통과한 시험(= 처음에 실패한 시험) 기록. 초록 뒤에 가려지지 않도록 30일 보관한다 — 두 번 이상 나온 시험은 고칠 대상(docs/ci.md).
      - name: 흔들린 시험 기록 올리기
        if: steps.retry.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-${{ matrix.shard }}
          path: /tmp/first-run/flaky-tests.txt
          if-no-files-found: ignore
          retention-days: 30
      # 시험이 실패했거나 작업 제한시간으로 취소돼도 보고서·실행 로그는 올라가게 always() 로 둔다(로그에서 멈춘 시험을 찾는다).
      - name: 서버 테스트 보고서 올리기
        if: always() && (failure() || cancelled() || steps.server-test.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports-${{ matrix.shard }}
          path: |
            furnace-server/build/reports/tests
            furnace-server/build/no-retry-failures.txt
            /tmp/first-run
            /tmp/shard-run.log
          if-no-files-found: ignore
          retention-days: 7
      # 서버 시험 단계는 continue-on-error 라 단계 제한시간으로 끝나도 작업이 초록이 될 수 있다(outcome 이 failure 가 아닌 값으로 남는 경우 포함).
      # 서버 시험이 성공하지 못했는데 재시도도 성공하지 못했으면 여기서 확실히 실패시킨다(보고서는 위에서 이미 올렸다).
      - name: 서버 시험 판정
        if: always() && steps.server-test.outcome != 'success' && steps.retry.outcome != 'success'
        run: |
          echo "::error::서버 테스트 조각 ${{ matrix.shard }} 가 성공하지 못했습니다(server-test=${{ steps.server-test.outcome }}, retry=${{ steps.retry.outcome }})."
          exit 1

  light:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != env.BASE_BRANCH }}
      - name: API 테스트
        run: ./gradlew -PskipOracle=true :furnace-api:test
      # 샘플 플러그인이 공개 API 만으로 컴파일되는지(테스트 코드는 없다)
      - name: 플러그인 샘플 컴파일
        run: ./gradlew -PskipOracle=true :furnace-plugin-test:classes
      # 헤드리스 시험 서버(플러그인 개발자용 시험 라이브러리) 자체 시험
      - name: 시험 서버 모듈 테스트
        run: ./gradlew -PskipOracle=true :furnace-test:test
      # Bukkit·Paper 호환 계층(H 묶음) 시험 — 헤드리스 시험 서버 위에서 돈다
      - name: 호환 계층 모듈 테스트
        run: ./gradlew -PskipOracle=true :furnace-compat-paper:test
      # 단일 실행 jar 가 만들어지는지(실행 검사는 아님). 러너·캐시·브랜치 정책은 사용자 결정 전이라 바꾸지 않았다.
      - name: fatJar 빌드
        run: ./gradlew -PskipOracle=true :furnace-server:fatJar
      # 기준 브랜치 실행에서만: user-todo 항목 파일을 한 문서로 합쳐 올린다(docs/user-todo/README.md)
      - name: user-todo 합친 문서 만들기
        if: github.event_name == 'push' && github.ref == env.BASE_BRANCH
        run: |
          mkdir -p build/user-todo
          tools/user-todo-combined.sh > build/user-todo/user-todo-combined.md
      - name: user-todo 합친 문서 올리기
        if: github.event_name == 'push' && github.ref == env.BASE_BRANCH
        uses: actions/upload-artifact@v4
        with:
          name: user-todo-combined
          path: build/user-todo/user-todo-combined.md
          retention-days: 14

  # 이름이 `test` 인 합친 판정(기존 점검 이름). 조각·light 중 하나라도 실패·취소면 실패.
  test:
    if: always()
    needs: [server-tests, light]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 판정
        run: |
          echo "server-tests=${{ needs.server-tests.result }} light=${{ needs.light.result }}"
          [ "${{ needs.server-tests.result }}" = "success" ] && [ "${{ needs.light.result }}" = "success" ]
