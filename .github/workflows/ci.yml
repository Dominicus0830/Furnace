name: CI

on:
  push:
  pull_request:

# 같은 브랜치에 새 푸시가 오면 앞선 실행을 취소해 러너 부하(시간에 민감한 시험의 불안정 원인)를 줄인다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Paper 저장소 없이 돌리므로 oracle 모듈은 건너뛴다(-PskipOracle=true)
      - name: API 테스트
        run: ./gradlew -PskipOracle=true :furnace-api:test
      # 샘플 플러그인이 공개 API 만으로 컴파일되는지(테스트 코드는 없다)
      - name: 플러그인 샘플 컴파일
        run: ./gradlew -PskipOracle=true :furnace-plugin-test:classes
      - name: 서버 테스트
        id: server-test
        continue-on-error: true
        run: ./gradlew -PskipOracle=true :furnace-server:test
      # 부하에서 가끔 실패하는 시간 민감 시험(CommandBlockOneTickTest 등)용: 한 번만 다시 돌린다. 두 번 다 실패하면 실패로 처리한다.
      - name: 서버 테스트 재시도(1회)
        if: steps.server-test.outcome == 'failure'
        run: |
          echo "::warning::서버 테스트가 한 번 실패해 재시도합니다(불안정 시험 의심)"
          ./gradlew -PskipOracle=true :furnace-server:cleanTest :furnace-server:test
      - name: 서버 테스트 보고서 올리기
        if: failure() || steps.server-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: furnace-server/build/reports/tests
          if-no-files-found: ignore
      # 헤드리스 시험 서버(플러그인 개발자용 시험 라이브러리) 자체 시험
      - name: 시험 서버 모듈 테스트
        run: ./gradlew -PskipOracle=true :furnace-test:test
      # 단일 실행 jar 가 만들어지는지(실행 검사는 아님). 러너·캐시·브랜치 정책은 사용자 결정 전이라 바꾸지 않았다.
      - name: fatJar 빌드
        run: ./gradlew -PskipOracle=true :furnace-server:fatJar
