# 시험 한 개(준비·정리 메서드 포함)의 기본 제한시간 — 멈춘 시험이 CI 작업 제한까지 가지 않게 한다. furnace-server 와 같은 값이다(A19-01).
# 메서드에 붙은 @Timeout 이 이 값보다 우선한다. 자세한 설명은 furnace-server/src/test/resources/junit-platform.properties.
junit.jupiter.execution.timeout.default=5m
junit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD
