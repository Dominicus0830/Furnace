# 이 서버가 따르는 마인크래프트 판 — 버전 숫자·문자열·리소스 이름은 여기 한 곳에서만 정한다.
# furnace-api 의 generateGameVersion 작업이 이 파일로 org.domi.furnace.api.GameVersion(public static final 상수)을 만든다.
# 상수라 javac 가 쓰는 자리에 값을 그대로 넣는다 — 실행 중 조회·분기 비용이 없다. 코드에 "1.21.1"·767·3955 를 직접 쓰지 않는다.
mc.version=1.21.1
mc.protocol=767
mc.dataVersion=3955
# 리소스 파일 이름의 판 꼬리표(blocks/definitions_<tag>.txt, worldgen/<tag>/ ...)
mc.resourceTag=1.21.1
# 크래프트 패키지 접미사(org.bukkit.craftbukkit.<suffix>)
mc.craftPackageSuffix=v1_21_R1
# 데이터 팩 pack_format
mc.packFormat.data=48
# worldgen-oracle(paperweight)이 정답을 뽑는 Paper 개발 번들
mc.paperDevBundle=1.21.1-R0.1-SNAPSHOT
