plugins {
    id 'java'
    id 'application'
    id 'io.papermc.paperweight.userdev' version '1.7.7'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
application { mainClass = 'org.domi.oracle.OracleMain' }
tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
    classpath = sourceSets.main.output + configurations.compileClasspath
    systemProperties = System.properties.findAll { it.key.toString().startsWith("oracle.") }
    // V-01: 판 꼬리표는 gradle/minecraft.properties 한 곳에서 온다(OracleMain 이 리소스 경로 이름에 쓴다)
    systemProperty 'oracle.resourceTag', rootProject.ext.mc.getProperty('mc.resourceTag')
}
dependencies {
    paperweight.paperDevBundle(rootProject.ext.mc.getProperty('mc.paperDevBundle'))
}

// T-227: Mojang 이름 Paper 서버 jar(CraftBukkit 포함)의 위치를 한 줄로 낸다. 서명표 도구가 `-PsigJar=<이 경로>` 로 읽는다.
// 이 jar 는 paperweight 캐시에만 있고 저장소·배포에는 넣지 않는다.
tasks.register('printPaperServerJar') {
    def jars = configurations.compileClasspath.incoming.artifactView { lenient = true }.files
    doLast {
        def j = jars.files.find { it.name.startsWith('paper-server') }
        if (j == null) throw new GradleException('paper-server jar 가 compileClasspath 에 없다')
        println "PAPER_SERVER_JAR=" + j.absolutePath
    }
}
